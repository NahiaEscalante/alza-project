# Local Postgres for development and tests (dev-only credentials).
# `npm run db:up` starts it; databases: `alza` (app) and `alza_test` (vitest).
services:
  postgres:
    image: postgres:16-alpine
    container_name: alza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alza
      POSTGRES_PASSWORD: alza
      POSTGRES_DB: alza
    ports:
      - "5433:5432"
    volumes:
      - alza-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alza -d alza"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  alza-postgres-data:
