  :root {
    --navy: #0E2A8B; --purple: #6A00B8; --lav: #E9DDFF; --blue-soft: #EAF0FF; --lav-soft: #EFE7FF;
    --bg: #F7F8FC; --card: #FFFFFF; --text: #10172F; --muted: #475569; --border: #E4E8F1;
    --ok: #0B6B4B; --warn: #B45309; --danger: #B42318; --mint: #4FD1C5; --gray: #64748B;
    --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-text-size-adjust: 100%; }
  button, input { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

  /* Contenedor: a pantalla completa en celular; centrado con ancho de app en escritorio */
  .app { position: relative; max-width: 440px; height: 100dvh; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  @media (min-width: 640px) {
    body { display: grid; place-items: center; padding: 24px 0; background: #E9ECF5; }

  /* ===== Navegación responsiva: barra inferior en celular (web y Android), barra lateral en escritorio ===== */

    body { display: block; padding: 0; background: var(--bg); }

    #nav { grid-area: nav; display: flex !important; flex-direction: column; gap: 4px; align-content: start; background: var(--card);
      border-top: 0; border-right: 1px solid var(--border); padding: 20px 12px; margin: 0; }

    .app:has(#nav[style*="none"]) { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "scroll"; }
    .toast { left: auto; right: 32px; bottom: 32px; width: 320px; }
  }

    state.draft = r ? { amount: r.amount, cat: r.cat, medio: r.medio } : null;

  if (view === 'wa') state.chatMode = params.mode || 'register';
  if (view === 'chat' && !state.chatLog.length) state.chatLog = [];
  render();
  document.getElementById('scroll').scrollTop = 0;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ===== Inicio ===== */
function chartHTML() {
  const DAYS = [
    { k: 'L', n: 'Lunes', v: 420, c: 3 }, { k: 'M', n: 'Martes', v: 610, c: 4 },
    { k: 'X', n: 'Miércoles', v: 380, c: 2 }, { k: 'J', n: 'Jueves', v: 760, c: 5 },
    { k: 'V', n: 'Viernes', v: 690, c: 4 }, { k: 'S', n: 'Sábado', v: 540, c: 3 },
    { k: 'D', n: 'Hoy', v: entra(), c: contados().length }
  ];
  const sel = state.chartDay || 'D';
  const max = Math.max(...DAYS.map(d => d.v), 1);
  const H = 120;
  const cols = DAYS.map(d => {
    const h = Math.max(6, Math.round(d.v / max * H));
    const on = sel === d.k;
    return `<button class="cb${on ? ' on' : ''}" data-act="pickDay" data-val="${d.k}" aria-pressed="${on}" aria-label="${d.n}: ${fmt(d.v)}, ${d.c} registros">
      <span class="cb-bar" style="height:${h}px"></span>
      <span class="cb-lbl">${d.k}</span>
    </button>`;
  }).join('');
  const cur = DAYS.find(d => d.k === sel);
  const previos = DAYS.filter(d => d.k !== 'D');
  const prom = previos.reduce((a, d) => a + d.v, 0) / previos.length;
  return `<div class="chart">
      <div class="chart-head"><h3>Tus ventas por día</h3><span class="muted">Toca un día</span></div>
      <div class="cbars" role="group" aria-label="Ventas por día">${cols}</div>
      <div class="cdet"><b>${cur.n}</b> · ${money(cur.v)} · ${cur.c} ${cur.c === 1 ? 'registro' : 'registros'}</div>
      <div class="cprom muted">Promedio de los días anteriores: ${money(prom)}</div>
    </div>`;
}

function rachaHTML() {
  const LET = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
  const end = state.dayClosed ? 6 : 5;               // índice del último día cerrado (6 = domingo, hoy)
  const ini = end - state.racha + 1;
  const dias = LET.map((l, i) => {
    const cerrado = i >= ini && i <= end;
    const hoy = i === 6 && !state.dayClosed;
    return `<div class="rk-d"><span class="rk-c${cerrado ? ' ok' : ''}${hoy ? ' hoy' : ''}">${cerrado ? '✓' : ''}</span><span class="rk-l">${l}</span></div>`;
  }).join('');
  const prox = state.racha < 7 ? 7 - state.racha : (30 - state.racha);
  const hito = state.racha < 7 ? `Te faltan ${prox} ${prox === 1 ? 'día' : 'días'} para +${PTS_STREAK7} puntos` : `Te faltan ${prox} ${prox === 1 ? 'día' : 'días'} para +${PTS_STREAK30} puntos`;
  return `<div class="racha">
    <div class="rk-top">
      <span class="rk-flame">${FLAME}</span>
      <div><b class="rk-n">${state.racha}</b> <span class="rk-t">${state.racha === 1 ? 'día seguido' : 'días seguidos'}</span></div>
      <span class="rk-com" aria-label="Comodines disponibles">${SHIELD} ${state.comodines}</span>
    </div>
    <div class="rk-week" aria-label="Días de esta semana">${dias}</div>
    <div class="rk-msg">${state.dayClosed ? '¡Día cerrado! ' : ''}${hito}.</div>
  </div>`;
}

/* ===== Historial demostrable ===== */
const hashCode = str => {
  let h1 = 5381, h2 = 52711;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = ((h1 << 5) + h1) ^ c; h2 = ((h2 << 5) + h2) ^ c; }
  return ((h1 >>> 0).toString(36) + (h2 >>> 0).toString(36)).toUpperCase().padEnd(10, '0').slice(0, 10);
};
const historialData = () => [...state.records, ...state.deleted].sort((a, b) => a.id - b.id).map(r => ({
  id: r.id, fecha: r.time, origen: ORIGIN[r.origin], respaldo: etiqueta(r).txt, categoria: CATS[r.cat].label, medio: r.medio,
  montoOriginal: r.original.amount, montoActual: r.amount,
  estado: state.deleted.includes(r) ? 'Eliminado' : (r.duda ? 'Por confirmar' : 'Registrado'),
  cambios: r.history.map(h => `${h.at} ${h.text}`).join(' | ')
}));
const codigo = () => 'ALZA-' + hashCode(JSON.stringify(historialData()) + JSON.stringify(state.ledger));

function viewHistorial() {
  const datos = historialData();
  const conCaptura = datos.filter(d => d.respaldo === 'Con foto' && d.estado !== 'Eliminado').length;
  const declarados = datos.filter(d => d.respaldo !== 'Con foto' && d.estado !== 'Eliminado').length;
  const editados = datos.filter(d => d.cambios).length;
  const filas = datos.slice().reverse().map(d => `
    <div class="hx-row${d.estado === 'Eliminado' ? ' hx-off' : ''}">
      <div class="hx-top"><b>#${d.id} · ${esc(d.fecha)}</b><span class="muted">${d.origen}</span></div>
      <div class="hx-mid">${d.categoria} · ${d.medio} · ${d.respaldo}</div>
      <div class="hx-amt">${d.montoOriginal !== d.montoActual ? `Original ${fmt(d.montoOriginal)} → ${fmt(d.montoActual)}` : `Monto ${fmt(d.montoActual)}`} · <b>${d.estado}</b></div>
      ${d.cambios ? `<div class="hx-chg">${esc(d.cambios)}</div>` : ''}
    </div>`).join('');
  return `<h1>Mi historial</h1>
    <div class="explica"><b>Así se guarda tu historial</b>
      <span>Cada registro guarda cómo llegó y su monto original.</span>
      <span>Si cambias algo, queda anotado con la hora.</span>
      <span>Si eliminas un registro, aparece aquí como eliminado, con la hora.</span>
    </div>
    <div class="card2 blue" style="min-height:0">
      <span>Movimientos registrados</span><b>${datos.length}</b>
      <small>${conCaptura} con captura · ${declarados} declarados · ${editados} editados · ${state.deleted.length} eliminados</small>
    </div>
    <div class="code"><span class="muted">Código de verificación</span><b>${codigo()}</b><small class="muted">Si alguien cambiara un registro, este código cambiaría. Así puedes comprobar que tu historial no fue modificado.</small></div>
    <div class="stack" style="margin-top:12px">
      <button class="btn btn-primary" data-act="exportCsv">Descargar historial (CSV)</button>
      <button class="btn btn-secondary" disabled>Compartir con mi banco · Próximamente</button>
    </div>
    <div class="sec"><span>Detalle</span></div>
    ${filas || '<div class="empty">Aún no hay movimientos.</div>'}`;
}

/* ===== Ajustes ===== */
function viewMas() {
  return `<h1>Ajustes</h1>
    <button class="list-row" data-act="goResumen">Resumen en WhatsApp<span class="muted">›</span></button>
    <div class="list-row"><span>Cierre de hoy<small>ALZA te pregunta por WhatsApp. Aquí solo ves el estado.</small></span><span class="muted">${state.dayClosed ? 'Cerrado' : 'Pendiente'}</span></div>
    <button class="list-row" data-act="toggleHide">Ocultar montos<span class="muted">${state.hide ? 'Activado' : 'Desactivado'}</span></button>
    <button class="list-row" data-act="howPoints">Cómo funcionan los puntos<span class="muted">›</span></button>
    <button class="list-row" data-act="soon">Ayuda<span class="muted">›</span></button>
    <p class="muted" style="margin-top:20px">ALZA · MVP de prueba. Datos de ejemplo en memoria.</p>`;
}

/* ===== Modal: cómo funcionan los puntos ===== */
function modalPuntos() {
  return `<div class="mdl-back" data-act="closeModal"></div>
    <div class="mdl" role="dialog" aria-modal="true" aria-labelledby="mdl-t" tabindex="-1">
      <button class="iconbtn mdl-x" data-act="closeModal" aria-label="Cerrar">${I.close}</button>
      <div class="mdl-img">${MODAL_IMG}</div>
      <h2 id="mdl-t">Así funcionan tus puntos</h2>
      <ol class="mdl-steps">
        <li><b>Registra por WhatsApp</b><span>Manda una foto de tu factura, una nota de voz o un texto al número oficial de ALZA.</span></li>
        <li><b>Cierra tu día</b><span>Cuando cierras el día completo ganas ${PTS_CLOSE_FULL} puntos. Si quedan dudas sin responder, ganas ${PTS_CLOSE_PART}.</span></li>
        <li><b>Mantén tu racha</b><span>Cada 7 días seguidos cerrando el día suma ${PTS_STREAK7} puntos extra. Cada 30 días suma ${PTS_STREAK30}.</span></li>
        <li><b>Canjea premios</b><span>Cuando llegas a un hito, canjeas el premio. Los puntos bajan al canjear.</span></li>
      </ol>
      <p class="muted mdl-note">Los registros y las ediciones no cambian tus puntos. Imagen referencial.</p>
      <button class="btn btn-primary" data-act="closeModal">Entendido</button>
    </div>`;
}

/* ===== Render ===== */
function render() {
  const v = state.view;
  const top = document.getElementById('top');
  const scroll = document.getElementById('scroll');
  const nav = document.getElementById('nav');
  const titles = { movs: 'Movimientos', premios: 'Premios', chat: 'Chat', historial: 'Mi historial', mas: 'Ajustes', wa: state.chatMode === 'resumen' ? 'Resumen' : 'WhatsApp', revisar: 'Revisar movimiento' };
  const isTab = TAB_VIEWS.includes(v);
  top.innerHTML = v === 'inicio' ? topBar('', false) : topBar(titles[v] || '', !isTab);

  const map = { inicio: viewInicio, movs: viewMovs, premios: viewPremios, chat: viewChat, revisar: viewRevisar, wa: viewWa, historial: viewHistorial, mas: viewMas };
  scroll.innerHTML = (map[v] || viewInicio)();

  const showNav = !['revisar', 'wa'].includes(v);
  nav.style.display = showNav ? 'grid' : 'none';
  nav.innerHTML = TABS.map(([k, l, ic]) => `<button class="${v === k ? 'on' : ''}" data-act="tab" data-val="${k}">${ic}${l}</button>`).join('');
  const modalEl = document.getElementById('modal');
  modalEl.innerHTML = state.modal === 'puntos' ? modalPuntos() : '';
  if (state.modal) document.querySelector('.mdl')?.focus();
}

/* ===== Acciones ===== */
const ACTIONS = {
  back() { go('inicio'); },
  tab(_, val) { state.chatMode = null; go(val); },
  toggleHide() { state.hide = !state.hide; render(); },
  goMas() { go('mas'); },
  goInicio() { go('inicio'); },
  goMovs() { go('movs'); },
  goPremios() { go('premios', { tab: 'premios' }); },
  goHistorial() { go('historial'); },
  goResumen() { go('wa', { mode: 'resumen' }); },
  openWa() {
    if (ALZA_WA_IS_PLACEHOLDER) { toast('Número oficial pendiente. Mostrando el registro de demostración.'); go('wa', { mode: 'register' }); return; }
    window.open(waLink(), '_blank', 'noopener');
  },
  soon() { toast('Disponible en la siguiente versión.'); },
  rtab(_, val) { state.params = { tab: val }; render(); },
  howPoints() { state.modal = 'puntos'; render(); },
  closeModal() { state.modal = null; render(); },
  filter(_, val) { state.filter = val; render(); },
  pickDay(_, val) { state.chartDay = val; render(); },
  revisar(id) { go('revisar', { id: Number(id) }); },
  revisarPrimero() { const p = pendientes()[0]; if (p) go('revisar', { id: p.id }); else toast('No tienes dudas abiertas.'); },
  ask(_, val) {
    state.chatLog.push({ me: true, text: { hoy: '¿Cuánto vendí hoy?', gasto: '¿Cuánto gasté hoy?', dudas: '¿Qué me falta confirmar?', puntos: '¿Cuántos puntos tengo?' }[val] });
    state.chatLog.push({ me: false, text: chatAnswer(val) });
    render();
  },
  sendWa(_, val) {
    const id = state.nextId++;
    let rec, msgs;
    if (val === 'foto') {
      rec = { id, title: 'Factura del distribuidor', origin: 'foto', time: nowTime(), medio: 'Efectivo', cat: 'mercaderia', amount: 85, duda: null, quote: 'Foto de factura del distribuidor' };
      msgs = [`<div class="bub me">Foto de factura</div>`, `<div class="bub">Listo. Lo registré como mercadería: ${fmt(85)}. Lo cierras al final del día.</div>`];
    } else if (val === 'audio') {
      rec = { id, title: 'Venta de pan y gaseosa', origin: 'audio', time: nowTime(), medio: 'Efectivo', cat: 'venta', amount: 30, duda: { q: 'Dijiste «hoy vendí 30». ¿Es todo el día o solo efectivo?', opts: ['Todo el día', 'Solo efectivo'] }, quote: '«Vendí treinta soles de pan y gaseosa»' };
      msgs = [`<div class="bub me">Nota de voz</div>`,
        `<div class="bub">Registré una venta de ${fmt(30)}. Tengo una duda:<small>${esc(rec.duda.q)}</small></div>`,
        `<div class="opts">${rec.duda.opts.map((o, i) => `<button class="btn" data-act="resolveDuda" data-id="${id}" data-val="${i}">${esc(o)}</button>`).join('')}</div>`];
    } else {
      rec = { id, title: 'Cobro Yape', origin: 'texto', time: nowTime(), medio: 'Yape', cat: 'venta', amount: 18, duda: null, quote: '«Cobro de 18 soles por Yape»' };
      msgs = [`<div class="bub me">Texto</div>`, `<div class="bub">Listo. Registré un cobro por Yape de ${fmt(18)}.</div>`];
    }
    rec.history = []; rec.edited = false; rec.original = { amount: rec.amount, cat: rec.cat, medio: rec.medio };
    state.records.push(rec);
    state.chatMsgs = msgs;
    render();
  },
  resolveDuda(id, val) {
    const r = findRec(id);
    if (!r || !r.duda) return;
    const elegida = r.duda.opts[Number(val)];
    r.history.push({ at: nowTime(), text: `Duda resuelta: ${elegida}` });
    if (elegida === 'Solo efectivo') r.medio = 'Efectivo';
    r.edited = true;
    r.duda = null;
    toast('Duda resuelta. Ya cuenta en tu resumen.');
    render();
  },
  setCat(_, val) { if (state.draft) state.draft.cat = val; render(); },
  confirm(id) {
    const r = findRec(id);
    if (!r) return;
    const amt = Number(document.getElementById('amt')?.value ?? r.amount);
    if (!(amt > 0)) { toast('Ingresa un monto mayor que cero.'); return; }
    const medio = document.getElementById('medio')?.value || r.medio;
    const cat = state.draft?.cat || r.cat;
    const cambios = [];
    if (amt !== r.amount) cambios.push(`monto ${fmt(r.amount)} → ${fmt(amt)}`);
    if (cat !== r.cat) cambios.push(`categoría ${CATS[r.cat].label} → ${CATS[cat].label}`);
    if (medio !== r.medio) cambios.push(`medio ${r.medio} → ${medio}`);
    if (r.duda) cambios.push('duda resuelta al guardar');
    if (!cambios.length) { toast('No hay cambios que guardar.'); return; }
    r.history.push({ at: nowTime(), text: 'Editado: ' + cambios.join(', ') });
    if (cambios.some(c => c.startsWith('monto') || c.startsWith('categoría') || c.startsWith('medio'))) r.edited = true;
    r.amount = amt; r.cat = cat; r.medio = medio; r.duda = null;
    state.draft = null;
    toast('Cambios guardados. Tus puntos no cambian.');
    go('movs');
  },
  delete(id) {
    const r = findRec(id);
    if (!r) return;
    state.records = state.records.filter(x => x.id !== r.id);
    r.history.push({ at: nowTime(), text: 'Eliminado' });
    state.deleted.push(r);
    state.draft = null;
    toast('Registro eliminado. Queda en Movimientos. Tus puntos no cambian.');
    go('movs');
  },
  cerrarDia() {
    if (state.view !== 'wa' || state.chatMode !== 'resumen') { toast('El cierre se hace respondiendo a ALZA por WhatsApp.'); return; }
    if (state.dayClosed) { toast('Hoy ya está cerrado.'); return; }
    const completo = pendientes().length === 0;
    const pts = completo ? PTS_CLOSE_FULL : PTS_CLOSE_PART;
    addLedger(completo ? 'Cierre completo del día' : 'Cierre a medias del día', pts);
    state.racha += 1;
    if (state.racha % 7 === 0) addLedger('Racha de 7 días', PTS_STREAK7);
    if (state.racha % 30 === 0) addLedger('Racha de 30 días', PTS_STREAK30);
    state.dayClosed = true;
    state.cierreMsg = `Listo, día cerrado: +${pts} puntos.`;
    toast(`Día cerrado: +${pts} puntos.`);
    render();
  },
  noCerrar() { toast('Sin problema. Te vuelvo a preguntar más tarde.'); },
  canjear(id) {
    const rw = REWARDS.find(x => x.id === id);
    if (!rw || points() < rw.hito) return;
    if (rw.grande && SEMANAS_ACTIVAS < 8) return;
    const code = 'DEMO-' + String((state.nextId * 7919 + rw.hito) % 10000).padStart(4, '0');
    state.redeemed.push({ id: rw.id, name: rw.name, cost: rw.hito, date: nowDate(), code, status: rw.grande ? 'En revisión' : 'Activo' });
    addLedger(`Canje: ${rw.name}`, -rw.hito, null);
    toast(`Canjeado. Código ${code}. Te quedan ${points()} puntos.`);
    state.params = { tab: 'beneficios' };
    render();
  },
  exportCsv() {
    const cols = ['id', 'fecha', 'origen', 'respaldo', 'categoria', 'medio', 'montoOriginal', 'montoActual', 'estado', 'cambios'];
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const lineas = [cols.join(','), ...historialData().map(d => cols.map(c => q(d[c])).join(','))];
    lineas.push(q(`Código de verificación: ${codigo()}`));
    const blob = new Blob([lineas.join('\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `alza-historial-${codigo()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Historial descargado.');
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (ACTIONS[act]) ACTIONS[act](el.dataset.id ?? null, el.dataset.val ?? null);
});
document.addEventListener('input', e => {
  if (e.target.id === 'amt' && state.draft) state.draft.amount = Number(e.target.value) || 0;
});
document.addEventListener('change', e => {
  if (e.target.id === 'medio' && state.draft) state.draft.medio = e.target.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.modal) ACTIONS.closeModal(); });

render();

</script>
</body>
</html>
